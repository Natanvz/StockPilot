name: CI

# Docs-only pushes skip CI (saves Actions minutes).
on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'graphify-out/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'graphify-out/**']

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  e2e:
    name: Playwright e2e (Firebase emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            e2e/screenshots/
            playwright-report/
          if-no-files-found: ignore
